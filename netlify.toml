# Configure Netlify builds.
[build]
  publish = "dist/"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # astro-netlify-cms@0.5.4 declares a peer range of astro ^1–^3 while the site
  # runs astro 4, so npm's strict peer resolution refuses to install.
  NPM_FLAGS = "--legacy-peer-deps"

# Request bots not to index the admin section.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"


[[redirects]]
  from = "/api/*" # simplify all calls to serverless functions
  to = "/.netlify/functions/:splat" # all function calls will go to this path
  status = 200 # ok code
  force = true # ensure to always redirect
